name: Build Adreno 650 Vulkan 1.4 API probe (experimental)

on:
  push:
    branches:
      - feature/a650-unified-vulkan14-20261015
    paths:
      - '.github/workflows/turnip_a650_vk14_probe.yml'
      - 'build_turnip.sh'
      - 'patches/a650/**'
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Optional full Mesa commit SHA; blank resolves Mesa main once and records it
        required: false
        type: string
      build_version:
        description: Artifact build version label
        required: true
        default: "vk14-probe"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Resolve pinned Mesa commit
        env:
          REQUESTED_MESA_REF: ${{ inputs.mesa_ref }}
        run: |
          if [ -n "$REQUESTED_MESA_REF" ]; then
            if ! [[ "$REQUESTED_MESA_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "mesa_ref must be a full lowercase SHA" >&2
              exit 2
            fi
            MESA_SHA="$REQUESTED_MESA_REF"
          else
            MESA_SHA="$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa refs/heads/main | cut -f1)"
          fi
          test "${#MESA_SHA}" -eq 40
          echo "MESA_COMMIT=$MESA_SHA" >> "$GITHUB_ENV"
          echo "Resolved Mesa SHA: $MESA_SHA" | tee mesa-source.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch ccache
          pip3 install --break-system-packages meson mako

      - name: Build experimental driver
        env:
          TURNIP_VK14_PROBE: "1"
          BUILD_VERSION: ${{ inputs.build_version }}
          META_NAME: "Turnip Adreno 650 Vulkan 1.4 API Probe (NON-CONFORMANT)"
          META_DESC: "Experimental API-version probe only. Vulkan 1.4 feature/limit audit and CTS are not complete; do not treat as conformant or production."
          BUILD_SUFFIX: "a650-vk14-probe"
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh
          git -C turnip_workdir/mesa diff --check
          git -C turnip_workdir/mesa diff -- src/freedreno/vulkan/tu_device.cc > vk14-probe.patch.diff
          grep -F 'props->apiVersion = TU_API_VERSION;' turnip_workdir/mesa/src/freedreno/vulkan/tu_device.cc
          python3 patches/a650/test_vk14_probe.py --source turnip_workdir/mesa/src/freedreno/vulkan/tu_device.cc
          python3 patches/a650/audit_vk14_source.py --source turnip_workdir/mesa/src/freedreno/vulkan/tu_device.cc --output vk14-source-audit.json

      - name: Verify artifact labels and provenance
        run: |
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          zips = sorted(pathlib.Path("turnip_workdir").glob("mesa-turnip-main-a650-vk14-probe-V*.zip"))
          if len(zips) != 1:
              raise SystemExit(f"Expected exactly one probe ZIP, got {len(zips)}")
          with zipfile.ZipFile(zips[0]) as z:
              meta = json.loads(z.read("meta.json"))
              assert "NON-CONFORMANT" in meta["name"]
              assert "not complete" in meta["description"]
              assert meta["driverVersion"].startswith("Vulkan 1.4.")
          pathlib.Path("vk14-probe-artifact.txt").write_text(
              f"mesaCommit={os.environ['MESA_COMMIT']}\n"
              f"artifact={zips[0]}\n"
              f"name={meta['name']}\n"
              f"driverVersion={meta['driverVersion']}\n")
          PY

      - name: Upload probe and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: turnip-a650-vulkan14-api-probe-${{ github.run_number }}
          if-no-files-found: error
          path: |
            turnip_workdir/mesa-turnip-main-a650-vk14-probe-V*.zip
            mesa-source.txt
            vk14-probe.patch.diff
            vk14-probe-artifact.txt
            vk14-source-audit.json
