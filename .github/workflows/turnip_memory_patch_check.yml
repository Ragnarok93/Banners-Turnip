name: Verify SD865 memory patch

on:
  push:
    branches:
      - feature/sd865-memory-pressure-20261016
    paths:
      - "build_turnip_perf.sh"
      - "patches/sd865/0005-tu-kgsl-sparse-bind-oom-cleanup.patch"
      - ".github/workflows/turnip_memory_patch_check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-patch:
    runs-on: ubuntu-latest
    env:
      MESA_COMMIT: dc671cbf0f76194c72b621205b6cc84e1c914fad
    steps:
      - name: Checkout driver repository
        uses: actions/checkout@v4

      - name: Check build script syntax
        run: bash -n build_turnip_perf.sh

      - name: Fetch pinned Mesa source
        run: |
          git clone --no-checkout --filter=blob:none https://gitlab.freedesktop.org/mesa/mesa.git mesa-source
          git -C mesa-source fetch --depth=1 origin "$MESA_COMMIT"
          git -C mesa-source checkout --detach "$MESA_COMMIT"
          test "$(git -C mesa-source rev-parse HEAD)" = "$MESA_COMMIT"

      - name: Verify patch applies exactly
        run: |
          cd mesa-source
          git apply --check ../patches/sd865/0005-tu-kgsl-sparse-bind-oom-cleanup.patch
          git apply ../patches/sd865/0005-tu-kgsl-sparse-bind-oom-cleanup.patch
          grep -q "The kernel BO exists now, including on a later mapping failure." src/freedreno/vulkan/tu_knl_kgsl.cc
          grep -q "GPUMEM_ALLOC_ID failed for %llu bytes" src/freedreno/vulkan/tu_knl_kgsl.cc
          grep -q "GPUMEM_BIND_RANGES failed for %llu bytes" src/freedreno/vulkan/tu_knl_kgsl.cc
          grep -q "KGSL memory heap: budget=%llu bytes, GPU VA=%llu bytes" src/freedreno/vulkan/tu_knl_kgsl.cc
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/freedreno/vulkan/tu_knl_kgsl.cc").read_text()
          va_query = source.index("get_kgsl_prop(fd, KGSL_PROP_GPU_VA64_SIZE")
          heap_size = source.index("device->heap.size = tu_get_system_heap_size(device);")
          assert va_query < heap_size, "KGSL VA-size query must precede heap-size calculation"
          dump_init = source.index("tu_dump_bo_init(dev, bo);")
          alloc_event = source.index("TU_RMV(bo_allocate, dev, bo);", dump_init)
          sparse_bind = source.index("result = kgsl_sparse_vma_map(dev, lazy_vma, bo, 0);")
          sparse_cleanup = source.index("kgsl_bo_finish(dev, bo);", sparse_bind)
          replay_map = source.index("result = kgsl_bo_user_map(dev, bo, client_iova);", sparse_bind)
          assert alloc_event < sparse_bind < sparse_cleanup < replay_map, "sparse-bind failure cleanup/event ordering changed"
          PY
